name: Package audit (manual only)

# Milestone one intentionally has no release-publication automation. This
# manually dispatched workflow proves that development packages can be built on
# each target without signing, notarizing, or publishing an installer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Unsigned package audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --dir
          - os: windows-2022
            args: --win --dir
          - os: ubuntu-latest
            args: --linux --dir
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Provide native-build tooling
        run: python -m pip install --upgrade setuptools
      - name: Install dependencies
        run: npm ci
      - name: Compile
        run: npm run build
      - name: Verify product identity and distributable assets
        run: npm run check:ventura-assets
      - name: Create an unsigned unpacked application
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
